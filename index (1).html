<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勉強スケジュール">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>勉強スケジュール 生徒用</title>
<style>html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one column. Header with progress ring, day tabs, a "now" card, a time-scaled timeline (height = minutes), week summary, then two small panels: send the week to the teacher (copyable text) and paste a new schedule from the teacher. No account, nothing leaves the device unless the student copies it. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface2: #E6EBF1;
  --fg: #16202B;
  --muted: #566371;
  --line: #D6DDE5;
  --accent: #16202B;
  --on-accent: #FFFFFF;
  --now: #A44A07;
  --now-bg: #FFF1DC;
  --danger: #B42318;
  --math: #1D4ED8; --math-bg: #DBEAFE; --math-ink: #1E3A8A;
  --sci: #15803D;  --sci-bg: #DCFCE7;  --sci-ink: #14532D;
  --jpn: #B91C1C;  --jpn-bg: #FEE2E2;  --jpn-ink: #7F1D1D;
  --calc: #7E22CE; --calc-bg: #F3E8FF; --calc-ink: #581C87;
  --soc: #0F766E;  --soc-bg: #CCFBF1;  --soc-ink: #134E4A;
  --eng: #A16207;  --eng-bg: #FEF3C7;  --eng-ink: #713F12;
  --mth: #BE185D;  --mth-bg: #FCE7F3;  --mth-ink: #831843;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --surface: #161D25; --surface2: #222C37; --fg: #E7ECF1; --muted: #9BA8B5; --line: #2B3642;
    --accent: #E7ECF1; --on-accent: #0E1318; --now: #F5B14C; --now-bg: #2B2012; --danger: #FF8A80;
    --math: #3461D6; --math-bg: #1A2745; --math-ink: #BFD2FF;
    --sci: #1B7F43;  --sci-bg: #143222;  --sci-ink: #B4EBC8;
    --jpn: #C73535;  --jpn-bg: #3A1A1C;  --jpn-ink: #FFC2C2;
    --calc: #8B3FD9; --calc-bg: #2D1B45; --calc-ink: #E2C8FF;
    --soc: #12857B;  --soc-bg: #0F2E2B;  --soc-ink: #A7F0E6;
    --eng: #A8650B;  --eng-bg: #33260A;  --eng-ink: #FDE68A;
    --mth: #C03A7B;  --mth-bg: #3A1A2B;  --mth-ink: #FBCFE8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #161D25; --surface2: #222C37; --fg: #E7ECF1; --muted: #9BA8B5; --line: #2B3642;
  --accent: #E7ECF1; --on-accent: #0E1318; --now: #F5B14C; --now-bg: #2B2012; --danger: #FF8A80;
  --math: #3461D6; --math-bg: #1A2745; --math-ink: #BFD2FF;
  --sci: #1B7F43;  --sci-bg: #143222;  --sci-ink: #B4EBC8;
  --jpn: #C73535;  --jpn-bg: #3A1A1C;  --jpn-ink: #FFC2C2;
  --calc: #8B3FD9; --calc-bg: #2D1B45; --calc-ink: #E2C8FF;
  --soc: #12857B;  --soc-bg: #0F2E2B;  --soc-ink: #A7F0E6;
  --eng: #A8650B;  --eng-bg: #33260A;  --eng-ink: #FDE68A;
  --mth: #C03A7B;  --mth-bg: #3A1A2B;  --mth-ink: #FBCFE8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums;
}
.app.wide { max-width: 1180px; }
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.s-math { --c: var(--math); --cbg: var(--math-bg); --ci: var(--math-ink); }
.s-sci  { --c: var(--sci);  --cbg: var(--sci-bg);  --ci: var(--sci-ink); }
.s-jpn  { --c: var(--jpn);  --cbg: var(--jpn-bg);  --ci: var(--jpn-ink); }
.s-calc { --c: var(--calc); --cbg: var(--calc-bg); --ci: var(--calc-ink); }
.s-soc  { --c: var(--soc);  --cbg: var(--soc-bg);  --ci: var(--soc-ink); }
.s-eng  { --c: var(--eng);  --cbg: var(--eng-bg);  --ci: var(--eng-ink); }
.s-mth  { --c: var(--mth);  --cbg: var(--mth-bg);  --ci: var(--mth-ink); }

.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.head > div { min-width: 0; }
.eyebrow { margin: 0; font-size: 14px; color: var(--muted); letter-spacing: .06em; }
h1 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.25; text-wrap: balance; }
.ring { position: relative; width: 68px; height: 68px; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface2); }
.ring .val { stroke: var(--accent); transition: stroke-dasharray .4s ease; }
.ring .cnt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.1; }
.ring .cnt small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px 7px; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.day .dw { font-size: 13px; font-weight: 700; }
.day .dn { font-size: 12px; color: var(--muted); }
.day .df { font-size: 11px; font-weight: 700; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .df { color: var(--on-accent); opacity: .8; }
.day.full .df { text-decoration: underline; text-underline-offset: 2px; }
.day .tdy { font-size: 10px; font-weight: 700; color: var(--now); line-height: 1.2; }
.day[aria-pressed="true"] .tdy { color: var(--on-accent); }

.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--now-bg); color: var(--now); border: 1px solid var(--now); }
.badge.plain { background: var(--surface2); color: var(--muted); border-color: var(--line); }
.chip { font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 999px; background: var(--c); color: #fff; }
.hero h2 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.hero .range { margin: 0; color: var(--muted); font-size: 14px; }
.remain { display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
.remain strong { font-family: var(--font-display); font-size: 40px; line-height: 1; }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; transition: width .4s ease; }
.hero .note { margin: 0; font-size: 14px; color: var(--muted); }
.hero.plain h2 { font-size: 22px; }

.komas { display: flex; flex-direction: column; gap: 22px; }
.koma h3 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-size: 17px; }
.koma h3 span { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.tl { position: relative; display: grid; grid-template-rows: repeat(var(--rows, 6), var(--slot)); }
.slot { display: flex; align-items: flex-start; width: 100%; margin: 0; padding: 0; border: 0; border-top: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 12px; text-align: left; }
.slot .lab { width: 52px; flex: none; padding-top: 2px; }
.slot.hr { border-top-style: solid; }
.slot.hr .lab { font-weight: 700; color: var(--fg); }
.slot.q { border-top-style: dotted; }
.tl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.blocks { position: absolute; left: 52px; right: 0; top: 0; bottom: 0; pointer-events: none; }
.task { position: absolute; left: 0; right: 0; pointer-events: auto; display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 6px; margin: 0; padding: 2px 4px 2px 12px; border-radius: 10px; background: var(--cbg); color: var(--ci); overflow: hidden; }
.task.tall { align-items: start; padding-top: 8px; }
.task .tx { min-width: 0; display: flex; flex-direction: column; }
.task .l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.task .subj { font-weight: 700; font-size: 15px; flex: none; }
.task .lb { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.task .mins { font-size: 12px; opacity: .85; flex: none; }
.task .l2 { font-size: 12px; opacity: .85; }
.task .tag { flex: none; font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
.task.lesson { background: var(--c); color: #fff; }
.task.now { outline: 3px solid var(--now); outline-offset: 1px; z-index: 2; }
.task.done .tx { opacity: .55; }
.task.done .subj, .task.done .lb { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 2px solid currentColor; background: transparent; display: grid; place-items: center; padding: 0; }
.chk svg { width: 22px; height: 22px; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.task.lesson .chk { color: #fff; }
.task.lesson .chk[aria-pressed="true"] { background: #fff; border-color: #fff; color: var(--c); }
.nowline { position: absolute; left: 44px; right: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -2px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.subs { display: flex; flex-direction: column; gap: 12px; }
.sub { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 14px; }
.sub b { font-weight: 700; }
.sub .bar { height: 12px; }
.sub span { color: var(--muted); font-size: 13px; text-align: right; min-width: 110px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { resize: vertical; min-height: 96px; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; word-break: break-all; min-height: 160px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cbtn { min-height: 44px; padding: 4px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.cbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 6px 20px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.msg { margin: 0; font-size: 14px; }
.msg.err { color: var(--danger); font-weight: 700; }
.msg.ok { color: var(--muted); }


.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tab { min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-weight: 700; font-size: 14px; padding: 4px 2px; }
.tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
select { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.sm { min-height: 40px; padding: 4px 14px; font-size: 14px; }
.pv { margin: 0; font-weight: 700; }

.wkwrap { overflow-x: auto; }
table.wk { width: 100%; border-collapse: collapse; }
table.wk th, table.wk td { border: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
table.wk thead th { background: var(--surface2); font-size: 13px; }
table.wk th[scope="row"] { width: 70px; text-align: center; background: var(--surface); }
table.wk th[scope="row"] b { display: block; font-size: 17px; font-family: var(--font-display); }
table.wk th[scope="row"] span, table.wk th[scope="row"] small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
table.wk tr.today th[scope="row"], table.wk tr.today td { background: var(--now-bg); }
table.wk ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.it { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 4px 8px; border-left: 5px solid var(--c); border-radius: 6px; background: var(--cbg); color: var(--ci); font-size: 14px; }
.it .bx { font-size: 16px; line-height: 1; }
.it .tm { font-size: 13px; }
.it .mn { font-size: 12px; opacity: .85; }
.it.lesson { background: var(--c); color: #fff; }
.none { color: var(--muted); font-size: 13px; }
.tot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.tot b { color: var(--fg); }
.print-only { display: none; }

.gtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; }
.gtop h1 { font-size: 24px; }
.gtop p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.gfields { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; }
input.nmin[type="text"] { width: 160px; min-height: 0; border: 0; border-bottom: 1px solid var(--muted); border-radius: 0; background: transparent; padding: 0 6px; text-align: center; font-size: 14px; }
.gfields .ul.nmprint { display: none; }
@media print { input.nmin[type="text"] { display: none; } .gfields .ul.nmprint { display: inline-block; } }
.gfields .ul { display: inline-block; min-width: 140px; border-bottom: 1px solid var(--muted); padding: 0 6px; text-align: center; }
.gwrap { overflow-x: auto; padding-bottom: 4px; }
.ggrid { --rh: 44px; display: grid; min-width: 960px; gap: 3px; grid-template-columns: 84px 48px repeat(7, minmax(0, 1fr));
  grid-template-rows: 44px repeat(6, minmax(var(--rh), auto)) 10px repeat(6, minmax(var(--rh), auto)) 10px repeat(6, minmax(var(--rh), auto)); }
.gh { background: var(--accent); color: var(--on-accent); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; line-height: 1.2; }
.gh small { font-size: 11px; font-weight: 400; opacity: .85; }
.gh.today { outline: 3px solid var(--now); outline-offset: 1px; }
.gcorner { grid-column: 1 / span 2; grid-row: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.gk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.gk b { font-size: 16px; }
.gk span { font-size: 12px; line-height: 1.4; text-align: center; color: var(--muted); }
.gt { display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 11px; color: var(--muted); }
.gc { box-sizing: border-box; min-width: 0; padding: 3px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: var(--cbg); color: var(--ci); display: flex; flex-direction: column; justify-content: center; gap: 1px; overflow: hidden; }
.gc.lesson { background: var(--c); border-color: var(--c); color: #fff; }
.gc .g1 { font-size: 13px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.gc.big .g1 { font-size: 16px; }
.gc.one { flex-direction: row; align-items: center; gap: 6px; }
.gc.one .g1 { flex: 1; min-width: 0; font-size: 12px; }
.gc.one .g2 { flex: none; white-space: nowrap; }
.gc .g2 { font-size: 11px; line-height: 1.3; opacity: .9; }
.gc .bx { font-style: normal; margin-right: 3px; font-weight: 400; }
.gc.wk { position: relative; padding: 0; display: block; }
.gedit { display: flex; flex-direction: column; justify-content: center; gap: 1px; box-sizing: border-box; width: 100%; height: 100%; margin: 0; font: inherit; color: inherit; background: none; border: 0; text-align: left; padding: 3px 28px 3px 8px; cursor: pointer; }
.gc.one .gedit { flex-direction: row; align-items: center; gap: 6px; }
.gdel { position: absolute; top: 3px; right: 3px; margin: 0; width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 14px; font-weight: 700; line-height: 1; border-radius: 50%; border: 1px solid var(--danger); background: var(--surface); color: var(--danger); cursor: pointer; }
.gdel.arm { width: auto; min-width: 22px; padding: 0 7px; border-radius: 11px; font-size: 11px; background: var(--danger); color: var(--surface); white-space: nowrap; }
.dl24 { display: flex; flex-direction: column; gap: 8px; }
.tk { box-sizing: border-box; width: 100%; margin: 0; font: inherit; text-align: left; border: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; min-height: 56px; border-radius: 12px; background: var(--cbg); color: var(--ci); }
.tk .tm { font-size: 13px; line-height: 1.3; opacity: .9; }
.tk .tx { min-width: 0; display: flex; flex-direction: column; }
.tk .l1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.tk .subj { font-weight: 700; font-size: 15px; }
.tk .lb { font-size: 14px; overflow-wrap: anywhere; }
.tk .mins { font-size: 12px; opacity: .85; }
.tk .l2 { font-size: 12px; opacity: .85; }
.tk .tag { flex: none; font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
.tk.lesson { background: var(--c); color: #fff; }
.tk.now { outline: 3px solid var(--now); outline-offset: 1px; }
.tk.sel { outline: 3px solid var(--fg); outline-offset: 1px; }
.tk.done .tx { opacity: .55; }
.tk.done .subj, .tk.done .lb { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.tk.lesson .chk { color: #fff; }
.tk.lesson .chk[aria-pressed="true"] { background: #fff; border-color: #fff; color: var(--c); }
button.tk { grid-template-columns: 64px minmax(0, 1fr); cursor: pointer; }
.w24 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; min-width: 840px; align-items: start; }
.wcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wcol .gh { min-height: 44px; }
.wcol .gc { flex: none; min-height: 44px; }
.fm { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 4px 2px; font-size: 12px; color: var(--muted); }
.fm.k { margin-top: 6px; border-top: 2px solid var(--fg); color: var(--fg); font-weight: 700; font-size: 14px; }
.fm.b { align-items: center; margin: 0; padding: 4px 12px; border-radius: 8px; background: var(--surface2); font-size: 12px; }
.kg { display: flex; flex-direction: column; gap: 8px; }
.fe { padding: 4px 12px; font-size: 13px; color: var(--muted); }

    if (t.closest('[data-delno]')) { S.delId = null; render(); return; }
    if ((b = t.closest('[data-wk]'))) { S.wk = b.getAttribute('data-wk') || ''; S.ed = null; S.edErr = ''; S.edInfo = ''; S.delId = null; S.rep = { open: false, days: {}, komas: {} }; render(); return; }
    if ((b = t.closest('[data-eview]'))) { S.eview = b.getAttribute('data-eview'); S.ed = null; S.edErr = ''; S.edInfo = ''; S.delId = null; S.rep = { open: false, days: {}, komas: {} }; render(); return; }
    if (t.closest('[data-wtobase]')) { applySched(editList()); S.baseMsg = { kind: 'ok', text: 'この週の時間割を、これから毎週の時間割にしました。' }; render(); return; }
    if ((b = t.closest('[data-ewk]'))) { S.ekey = b.getAttribute('data-ewk'); S.ed = null; S.edErr = ''; S.edInfo = ''; S.pageMsg = ''; S.delArm = false; S.wrAsk = false; S.clearAsk = false; S.rep = { open: false, days: {}, komas: {} }; render(); return; }
    if ((b = t.closest('[data-emode]'))) { S.emode = b.getAttribute('data-emode'); S.ed = null; S.edErr = ''; S.edInfo = ''; S.pageMsg = ''; S.delArm = false; S.wrAsk = false; S.clearAsk = false; S.rep = { open: false, days: {}, komas: {} }; render(); return; }
    if (t.closest('[data-wreset]')) {
      if (!S.wrAsk) { S.wrAsk = true; render(); return; }
      var wk = ekeyNow(); lsDel('wo:' + wk); lsDel('wv:' + wk);
      if (wk === S.key) { tasks = normList(sched.tasks); snapSave(S.key, tasks); } else lsDel('wt:' + wk);
      S.wrAsk = false; S.ed = null; S.pageMsg = 'この週の変更をやめて、基本の時間割にもどしました。'; render(); return;
    }
    if ((b = t.closest('[data-eday]'))) { S.eday = +b.getAttribute('data-eday'); S.ed = null; S.edErr = ''; S.edInfo = ''; S.pageMsg = ''; S.delArm = false; render(); return; }
    if ((b = t.closest('[data-sadd]'))) { var sv = b.getAttribute('data-sadd'); openEd(null, S.eday, sv.charAt(0), +sv.slice(1)); return; }
    if ((b = t.closest('[data-jt]'))) { goMin(+b.getAttribute('data-jt'), null); return; }
    if ((b = t.closest('[data-kst]'))) { if (S.ed) { S.ed.s = Math.round(+b.getAttribute('data-kst') / 5); if (!S.ed.id) { S.ed.n = 18; S.ed.label = '授業'; } if (S.ed.s + S.ed.n > KOMA[S.ed.koma].slots) S.ed.n = KOMA[S.ed.koma].slots - S.ed.s; S.edErr = ''; render(); } return; }
    if ((b = t.closest('[data-dur]'))) { if (S.ed) { S.ed.n = +b.getAttribute('data-dur'); S.edErr = ''; render(); } return; }
    if ((b = t.closest('[data-subj]'))) { if (S.ed) { S.ed.subj = b.getAttribute('data-subj'); render(); } return; }
    if (t.closest('[data-eddel]')) { if (!S.ed || !S.ed.id) return; if (!S.delArm) { S.delArm = true; render(); return; } var dd = S.ed; putEdit(editList().filter(function (x) { return x.id !== dd.id; })); S.ed = null; S.delArm = false; S.pageMsg = '削除しました。'; render(); jumpTo(dd.day, dd.koma, null, KOMA[dd.koma].start + dd.s * U(dd.koma)); return; }
    if (t.closest('[data-clear]')) { S.clearAsk = true; render(); return; }
    if (t.closest('[data-clearno]')) { S.clearAsk = false; render(); return; }
    if (t.closest('[data-clearok]')) { putEdit([]); S.clearAsk = false; S.ed = null; S.pageMsg = 'すべての予定を削除しました。'; render(); return; }
    if (t.closest('[data-edsave]')) { saveEd(); return; }
    if (t.closest('[data-edcopy]')) { copyEd(); return; }
    if (t.closest('[data-edrep]')) { S.rep.open = !S.rep.open; render(); return; }
    if ((b = t.closest('[data-repday]'))) { var rd = b.getAttribute('data-repday'); S.rep.days[rd] = !S.rep.days[rd]; render(); return; }
    if ((b = t.closest('[data-repkoma]'))) { var rk = b.getAttribute('data-repkoma'); S.rep.komas = S.rep.komas || {}; S.rep.komas[rk] = !S.rep.komas[rk]; render(); return; }
    if (t.closest('[data-repsave]')) { var ds = Object.keys(S.rep.days).filter(function (d) { return S.rep.days[d]; }).map(Number), ks = Object.keys(S.rep.komas || {}).filter(function (c) { return S.rep.komas[c]; }); if (!ds.length && !ks.length) { S.edErr = 'くり返す曜日かコマを選んでください。'; render(); return; } saveEd(ds, ks); return; }
    if (t.closest('[data-wkedit]')) { S.wkEdit = !S.wkEdit; if (!S.wkEdit) { S.ed = null; S.edErr = ''; } render(); return; }
    if ((b = t.closest('[data-wedit]'))) { var wt = editList().filter(function (x) { return x.id === b.getAttribute('data-wedit'); })[0]; if (wt) openEd(wt); return; }
    if ((b = t.closest('[data-wadd]'))) { var pr = b.getAttribute('data-wadd').split(':'); openEd(null, +pr[0], pr[1], +pr[2]); return; }
    if (t.closest('[data-edcancel]')) { S.ed = null; S.edErr = ''; S.edInfo = ''; S.delArm = false; S.rep = { open: false, days: {}, komas: {} }; render(); return; }
    if ((b = t.closest('[data-chip]'))) { if (S.ed) { S.ed.label = b.getAttribute('data-chip'); render(); } return; }
    if (t.closest('[data-reset]')) { S.resetAsk = true; S.baseMsg = null; render(); return; }
    if (t.closest('[data-resetno]')) { S.resetAsk = false; render(); return; }
    if (t.closest('[data-basesave]')) { lsSet('mybase', JSON.stringify({ at: Date.now(), t: editList().map(toArr) })); S.baseMsg = { kind: 'ok', text: 'いまの時間割を、基本として登録しました。' }; S.resetAsk = false; render(); return; }
    if (t.closest('[data-resetok]')) { var mb2 = myBase(); putEdit(mb2 ? mb2.tasks : base.tasks); S.resetAsk = false; S.ed = null; S.baseMsg = { kind: 'ok', text: (mb2 ? '登録した基本の時間割' : '最初の時間割') + 'にもどしました。' }; render(); return; }
  });
  app.addEventListener('change', function (ev) {
    var id = ev.target.id, v = ev.target.value;
    if (id === 'hsel') { S.hist = v; render(); return; }
    if (!S.ed || id.indexOf('ed-') !== 0 || id === 'ed-label') return;
    var e = S.ed;
    if (id === 'ed-day') { e.day = +v; if (isF(e.day)) { e.koma = 'F'; e.s = 0; } else if (e.koma === 'F') { e.koma = 'A'; e.s = 0; } }
    else if (id === 'ed-koma') { e.koma = v; e.s = 0; if (e.n > 6) e.n = 6; if (!e.id && KSTART[v]) { e.n = 6; e.label = '授業'; } }
    else if (id === 'ed-s') { e.s = +v; if (e.s + e.n > KOMA[e.koma].slots) e.n = KOMA[e.koma].slots - e.s; }
    S.edErr = ''; render();
  });
  app.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (id === 'nm') {
      S.name = ev.target.value; lsSet('name', S.name);
      var r = document.getElementById('rep'); if (r) r.value = reportText(S.hist);
    } else if (id === 'nm2') { S.name = ev.target.value; lsSet('name', S.name); var pn = document.querySelector('.nmprint'); if (pn) pn.textContent = (S.name || '') + '\u00a0'; } else if (id === 'ed-label' && S.ed) S.ed.label = ev.target.value;
    else if (id === 'ln') { S.lname = ev.target.value; var lk = document.getElementById('lnk'); if (lk) lk.value = linkText(S.lname); }
  });

  render();

  function tick() {
    if (rollover()) { render(); return; }
    var h = document.getElementById('hero'); if (h) h.innerHTML = hero();
    var rows = document.querySelectorAll('.task[data-id]'), n = nowMin();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], s = +r.getAttribute('data-s'), e = +r.getAttribute('data-e');
      r.classList.toggle('now', S.sel === todayNum() && s <= n && n < e);
      if (S.sel === todayNum() && e <= n && !r.classList.contains('done') && !r.querySelector('.tag')) {
        var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'まだ'; r.querySelector('.l1').appendChild(tg);
      }
    }
    updateNow();
  }
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
})();
</script>

</body>
</html>
